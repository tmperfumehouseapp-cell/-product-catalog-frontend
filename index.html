<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Product Catalog</h1>
    <a href="add_product.html">+ Add Product</a>
</header>

<div class="container">
    <div class="filters">
        <div class="filter-field">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Product name...">
        </div>
        <div class="filter-field">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter"><option value="">All Categories</option></select>
        </div>
        <div class="filter-field">
            <label for="genderFilter">Gender</label>
            <select id="genderFilter">
                <option value="">All Genders</option>
                <option value="men">Men</option>
                <option value="women">Women</option>
                <option value="unisex">Unisex</option>
            </select>
        </div>
        <div class="filter-field">
            <label for="brandFilter">Brand</label>
            <select id="brandFilter"><option value="">All Brands</option></select>
        </div>
        <button class="clear-btn" id="clearBtn">Clear Filters</button>
    </div>

    <div class="results-count" id="resultsCount"></div>

    <div class="grid" id="productGrid">
        <div class="loading">Loading products...</div>
    </div>

    <div class="load-more-wrap">
        <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Load More</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
