<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-header">
    <div class="title-row">
        <h1>Product Catalog</h1>
    </div>
    <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search products...">
    </div>
</div>

<div class="filter-panel">
    <div class="category-row" id="categoryRow">
        <span class="cat-btn active" data-category="">All Category</span>
    </div>

    <div class="dual-select-row">
        <select id="brandFilter"><option value="">All Brands</option></select>
        <select id="genderFilter">
            <option value="">All Genders</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="unisex">Unisex</option>
        </select>
    </div>
</div>

<div class="container">
    <div class="results-count" id="resultsCount"></div>

    <div class="grid" id="productGrid"></div>

    <div class="load-more-wrap">
        <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Load More</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
