<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Add Product</h1>
    <a href="index.html">← Back to Catalog</a>
</header>

<div class="container">

    <div class="form-card" id="passwordGate">
        <label for="adminPasswordInput">Admin Password</label>
        <input type="password" id="adminPasswordInput" placeholder="Enter password">
        <button type="button" id="unlockBtn">Unlock</button>
        <div id="gateMsg"></div>
    </div>

    <form class="form-card" id="productForm" style="display:none;">
        <label for="name">Product Name</label>
        <input type="text" id="name" name="name" required>

        <label>Product Images (1–4)</label>
        <div class="image-drop" id="dropZone">
            Click to select images, or drag & drop here
            <input type="file" id="imageInput" accept=".jpg,.jpeg,.png,.webp" multiple>
        </div>
        <div class="preview-grid" id="previewGrid"></div>

        <label for="price">Price (₹)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" required>

        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="e.g. Perfume, Shirt, Watch" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="unisex">Unisex</option>
        </select>

        <label for="brand">Brand</label>
        <input type="text" id="brand" name="brand" required>

        <label>Does this product have size/variant options?</label>
        <div style="display:flex; gap:20px; margin-top:6px;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
                <input type="radio" name="hasVariants" value="no" checked style="width:auto;"> No
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:0;">
                <input type="radio" name="hasVariants" value="yes" style="width:auto;"> Yes
            </label>
        </div>

        <div id="variantSection" style="display:none; margin-top:12px;">
            <label style="margin-top:0;">Variants (e.g. 20ml, 50ml, 100ml)</label>
            <div id="variantRows"></div>
            <button type="button" id="addVariantBtn" style="width:auto; margin-top:8px; padding:8px 16px; background:#f0f0f0; color:#333; font-size:13px;">+ Add variant</button>
        </div>

        <button type="submit" id="submitBtn" style="margin-top:22px;">Add Product</button>
        <div id="formMsg"></div>
    </form>
</div>

<script>
const API_BASE = 'https://fourpirates.tmfragrance.com/visitor/product-api';

// ---- Password gate ----
const passwordGate = document.getElementById('passwordGate');
const productForm = document.getElementById('productForm');
const adminPasswordInput = document.getElementById('adminPasswordInput');
const unlockBtn = document.getElementById('unlockBtn');
const gateMsg = document.getElementById('gateMsg');

let adminPassword = sessionStorage.getItem('adminPassword') || '';

if (adminPassword) {
    passwordGate.style.display = 'none';
    productForm.style.display = 'block';
}

unlockBtn.addEventListener('click', () => {
    const entered = adminPasswordInput.value.trim();
    if (!entered) {
        gateMsg.textContent = 'Enter a password.';
        gateMsg.className = 'error';
        return;
    }
    adminPassword = entered;
    sessionStorage.setItem('adminPassword', entered);
    passwordGate.style.display = 'none';
    productForm.style.display = 'block';
});

adminPasswordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') unlockBtn.click();
});

// ---- Image upload + preview ----
const form = productForm;
const msg = document.getElementById('formMsg');
const btn = document.getElementById('submitBtn');
const dropZone = document.getElementById('dropZone');
const imageInput = document.getElementById('imageInput');
const previewGrid = document.getElementById('previewGrid');

let selectedFiles = [];

dropZone.addEventListener('click', () => imageInput.click());
dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = '#1a1a1a';
});
dropZone.addEventListener('dragleave', () => {
    dropZone.style.borderColor = '#ddd';
});
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = '#ddd';
    addFiles(Array.from(e.dataTransfer.files));
});
imageInput.addEventListener('change', () => {
    addFiles(Array.from(imageInput.files));
    imageInput.value = '';
});

function addFiles(files) {
    const validExt = ['jpg', 'jpeg', 'png', 'webp'];
    for (const file of files) {
        if (selectedFiles.length >= 4) {
            msg.textContent = 'Maximum 4 images allowed.';
            msg.className = 'error';
            break;
        }
        const ext = file.name.split('.').pop().toLowerCase();
        if (!validExt.includes(ext)) {
            msg.textContent = `${file.name} is not a supported image type.`;
            msg.className = 'error';
            continue;
        }
        if (file.size > 5 * 1024 * 1024) {
            msg.textContent = `${file.name} is over 5MB.`;
            msg.className = 'error';
            continue;
        }
        selectedFiles.push(file);
    }
    renderPreviews();
}

function renderPreviews() {
    previewGrid.innerHTML = selectedFiles.map((file, i) => `
        <div class="preview-item">
            <img src="${URL.createObjectURL(file)}" alt="preview">
            <button type="button" class="remove-btn" onclick="removeFile(${i})">×</button>
        </div>
    `).join('');
}

function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderPreviews();
}

// ---- Variants: Yes/No toggle + dynamic rows ----
const variantSection = document.getElementById('variantSection');
const variantRows = document.getElementById('variantRows');
const addVariantBtn = document.getElementById('addVariantBtn');

document.querySelectorAll('input[name="hasVariants"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
        if (e.target.value === 'yes') {
            variantSection.style.display = 'block';
            if (variantRows.children.length === 0) addVariantRow();
        } else {
            variantSection.style.display = 'none';
            variantRows.innerHTML = '';
        }
    });
});

function addVariantRow() {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:8px; margin-bottom:8px;';
    row.innerHTML = `
        <input type="text" class="variant-input" placeholder="e.g. 20ml" style="flex:1;">
        <button type="button" class="remove-variant-btn" style="width:auto; padding:0 14px; background:#f0f0f0; color:#c0392b; font-size:16px;">×</button>
    `;
    row.querySelector('.remove-variant-btn').addEventListener('click', () => row.remove());
    variantRows.appendChild(row);
}

addVariantBtn.addEventListener('click', addVariantRow);

function getVariants() {
    const hasVariants = document.querySelector('input[name="hasVariants"]:checked').value;
    if (hasVariants !== 'yes') return [];
    return Array.from(document.querySelectorAll('.variant-input'))
        .map(i => i.value.trim())
        .filter(v => v !== '');
}

// ---- Submit ----
form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (selectedFiles.length === 0) {
        msg.textContent = 'Please select at least one image.';
        msg.className = 'error';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';
    msg.textContent = '';
    msg.className = '';

    const formData = new FormData();
    formData.append('admin_password', adminPassword);
    formData.append('name', document.getElementById('name').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('category', document.getElementById('category').value);
    formData.append('gender', document.getElementById('gender').value);
    formData.append('brand', document.getElementById('brand').value);
    selectedFiles.forEach(file => formData.append('images[]', file));
    getVariants().forEach(v => formData.append('variants[]', v));

    try {
        const res = await fetch(`${API_BASE}/add_product.php`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

        if (res.status === 403) {
            sessionStorage.removeItem('adminPassword');
            msg.textContent = 'Incorrect admin password. Please re-enter.';
            msg.className = 'error';
            productForm.style.display = 'none';
            passwordGate.style.display = 'block';
            adminPasswordInput.value = '';
            return;
        }

        if (res.ok && data.success) {
            msg.textContent = 'Product added successfully!';
            msg.className = 'success';
            form.reset();
            selectedFiles = [];
            renderPreviews();
            variantSection.style.display = 'none';
            variantRows.innerHTML = '';
        } else {
            msg.textContent = data.error || 'Something went wrong.';
            msg.className = 'error';
        }
    } catch (err) {
        msg.textContent = 'Network error: ' + err.message;
        msg.className = 'error';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Add Product';
    }
});
</script>

</body>
</html>
