<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Product Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* =========================================================
   LUXE DARK-GOLD THEME — products page override layer.
   Matches the new homepage. style.css stays untouched.
   ========================================================= */
body { background: #0d0b08 !important; color: #e9e2d4; }

.top-header {
    background: rgba(13,11,8,0.92) !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(212,175,106,0.16) !important;
    box-shadow: none !important;
}
.hamburger-btn, .search-icon-btn {
    background: rgba(255,255,255,0.06) !important;
    border: 1px solid rgba(212,175,106,0.4) !important;
    color: #f2ecdf !important;
}
.hamburger-btn:hover, .search-icon-btn:hover {
    background: rgba(212,175,106,0.12) !important;
    border-color: rgba(212,175,106,0.9) !important;
}
.search-input-hidden { background: #15130e !important; border-color: rgba(212,175,106,0.3) !important; color: #f2ecdf !important; }

.drawer { background: #0f0d09 !important; }
.drawer-head { border-bottom: 1px solid rgba(212,175,106,0.16) !important; }
.drawer-logo, .drawer-close-btn { color: #f2ecdf !important; }
.drawer-close-btn { background: rgba(255,255,255,0.06) !important; border: 1px solid rgba(212,175,106,0.4) !important; }
.drawer-link { color: #cfc8bb !important; }
.drawer-link:hover, .drawer-link.active { background: #17140e !important; color: #d4af6a !important; }

/* Category story circles */
.category-stories { background: #0d0b08 !important; border-bottom: 1px solid rgba(212,175,106,0.12) !important; }
.story-circle { border-color: rgba(212,175,106,0.45) !important; background: #15130e; }
.story-circle.active { border-color: #d4af6a !important; box-shadow: 0 0 14px rgba(212,175,106,0.3); }
.story-label { color: #a89a7c !important; }
.story-circle.all-circle { background: #15130e !important; color: #d4af6a !important; }

/* Toolbar + filter button */
.toolbar-row { background: #0d0b08 !important; }
.results-count { color: #8f897d !important; }
.filter-toggle-btn {
    background: transparent !important;
    border: 1px solid rgba(212,175,106,0.6) !important;
    color: #f2ecdf !important;
    box-shadow: none !important;
}
.filter-toggle-btn:hover { background: rgba(212,175,106,0.12) !important; }

/* Product cards */
.card {
    background: #15130e !important;
    border: 1px solid rgba(212,175,106,0.18) !important;
    border-radius: 10px !important;
    box-shadow: 0 10px 22px rgba(0,0,0,0.35) !important;
}
.card:hover { transform: translateY(-4px); border-color: rgba(212,175,106,0.6) !important; }
.card-img-wrap { background: #100e0a !important; }
.card-body { background: #15130e !important; }
.card-body .brand-label { color: #8f897d !important; }
.card-body h3 { color: #f2ecdf !important; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
.card-body .price { color: #d4af6a !important; }
.badge-pill, .card .tag, .card-body .tag, .meta .tag {
    background: #000 !important;
    color: #d4af6a !important;
    border: 1px solid rgba(212,175,106,0.3) !important;
}
.card-wishlist-btn { background: rgba(13,11,8,0.7) !important; color: #f2ecdf !important; }
.card-wishlist-btn.active { background: #e0342e !important; }

/* Filter drawer */
.filter-drawer { background: #0f0d09 !important; }
.filter-drawer-head { background: #0f0d09 !important; border-bottom: 1px solid rgba(212,175,106,0.16) !important; color: #f2ecdf !important; }
.filter-drawer-head span { color: #f2ecdf !important; }
.filter-drawer-close { color: #f2ecdf !important; }
.filter-drawer-body { background: #0f0d09 !important; }
.fd-section { border-bottom: 1px solid rgba(212,175,106,0.12) !important; }
.fd-section-head { color: #e9e2d4 !important; }
.fd-chevron { color: #a89a7c !important; }
.fd-option { color: #cfc8bb !important; }
.fd-option input[type="checkbox"] { accent-color: #d4af6a; }
.fd-count { color: #8f897d !important; }
.fd-show-more { color: #d4af6a !important; }
.fd-clear-btn { color: #d4af6a !important; border-color: rgba(212,175,106,0.5) !important; background: transparent !important; }
.filter-drawer-footer { background: #0f0d09 !important; border-top: 1px solid rgba(212,175,106,0.16) !important; }
.filter-drawer-footer button { background: #e0342e !important; color: #fff !important; }

/* Load more + footer */
.load-more-btn {
    background: transparent !important;
    border: 1px solid rgba(212,175,106,0.6) !important;
    color: #f2ecdf !important;
    letter-spacing: 1px;
}
.load-more-btn:hover { background: rgba(212,175,106,0.12) !important; }
.footer-brand-banner { background: #000 !important; border-top: 1px solid rgba(212,175,106,0.18) !important; }
.site-footer { background: #000 !important; }
.footer-brand-copy { color: #8f897d !important; }
.footer-brand-copyright { color: #5b564c !important; }

/* HIDE ALL PRICES (site-wide request) */
.card-body .price, .search-suggest-price, .price-row .price { display: none !important; }

/* =========================================================
   PRODUCT-OPEN TRANSITION (View Transitions API)
   The tapped product image morphs into the product page's
   main image. Browsers without support fall back to normal
   instant navigation — nothing breaks.
   ========================================================= */
@view-transition { navigation: auto; }
::view-transition-group(product-hero) {
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(.25,.9,.3,1);
}
::view-transition-old(product-hero), ::view-transition-new(product-hero) {
    height: 100%;
    object-fit: cover;
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.3s; }

/* =========================================================
   PAGE PEEL transition (product open)
   A gold-edged "page corner" sweeps from the bottom-right,
   covers the screen, the next page loads, then it peels back
   away to the corner. Runs alongside the image-fly morph.
   ========================================================= */
#peelLayer {
    position: fixed;
    right: 0; bottom: 0;
    width: 260vmax; height: 260vmax;
    z-index: 99999;
    pointer-events: none;
    background: linear-gradient(315deg,
        #171310 0%, #171310 46%,
        #3a3020 48%, #c9a35d 50%, #f0d9a8 51%, #c9a35d 52%,
        #12100b 54%, #0d0b08 100%);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    box-shadow: -14px -14px 40px rgba(0,0,0,0.65);
    /* transform-based = GPU compositing, no layout work per frame */
    transform: scale(0);
    transform-origin: bottom right;
    transition: transform 0.55s cubic-bezier(.65, 0, .35, 1);
    will-change: transform;
}
#peelLayer.cover { transform: scale(1); }
#peelLayer.instant { transition: none; }

/* =========================================================
   ACCESSIBILITY: respect "reduce motion" system setting
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
        scroll-behavior: auto !important;
    }
    #peelLayer { display: none !important; }
}
</style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<div class="top-header">
    <div class="title-row">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="logo-wrap">
            <a href="index.html"><img src="assets/logo.png" alt="3rd Party — Masters of Style" class="site-logo"></a>
        </div>

        <form class="search-box" id="searchBox">
            <input type="search" id="searchInput" placeholder="Search..." class="search-input-hidden">
            <button type="submit" class="search-icon-btn" id="searchToggle" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </form>

        <div class="header-icons">
        </div>
    </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer">
    <div class="drawer-head">
        <span class="drawer-logo">Product Catalog</span>
        <button class="drawer-close-btn" id="drawerClose" aria-label="Close menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="drawer-nav" id="drawerNav"></div>
</nav>

<div class="category-stories" id="categoryRow"></div>

<div class="toolbar-row">
    <div class="results-count" id="resultsCount"></div>
    <div class="toolbar-actions">
        <button type="button" class="filter-toggle-btn" id="filterToggleBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filter
        </button>
    </div>
</div>

<!-- Hidden source-of-truth selects — synced by the filter drawer checkboxes -->
<select id="brandFilter" class="visually-hidden"><option value="">All Brands</option></select>
<select id="genderFilter" class="visually-hidden">
    <option value="">All Genders</option>
    <option value="men">Men</option>
    <option value="women">Women</option>
    <option value="unisex">Unisex</option>
</select>

<div class="filter-drawer-overlay" id="filterDrawerOverlay"></div>

<div class="page-layout">
    <div class="filter-drawer" id="filterDrawer">
        <div class="filter-drawer-head">
            <span>Filter</span>
            <button class="filter-drawer-close" id="filterDrawerClose" aria-label="Close filter">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="filter-drawer-body">
            <div class="fd-section">
                <button type="button" class="fd-section-head" data-target="fdGender">
                    Gender
                    <svg class="fd-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
                </button>
                <div class="fd-section-body" id="fdGender"></div>
            </div>

            <div class="fd-section">
                <button type="button" class="fd-section-head" data-target="fdBrand">
                    Brand
                    <svg class="fd-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
                </button>
                <div class="fd-section-body" id="fdBrand"></div>
            </div>
        </div>

        <div class="filter-drawer-footer">
            <button type="button" class="fd-clear-btn" id="fdClearBtn">Clear all</button>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>

        <div class="load-more-wrap">
            <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Load More</button>
        </div>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-brand-banner">
        <p class="footer-brand-copy">Authentic perfumes, watches, and shoes, all in one place. 3rd Party brings you genuine accessories from the brands you trust, at prices that actually make sense — no compromises, just the real thing.</p>
        <img src="assets/logo-white.png" alt="3rd Party — Masters of 9A" class="footer-brand-logo">
        <p class="footer-brand-copyright">&#169; 2026, 3rd Party</p>
    </div>
</footer>

<script>
document.querySelectorAll('.footer-heading').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var body = document.getElementById(btn.dataset.target);
        var isOpen = btn.classList.toggle('open');
        if (body) body.classList.toggle('open', isOpen);
    });
});
</script>

<script src="common.js"></script>
<script src="products.js?v=20260909e"></script>

<script>
/* Name the tapped product image just before navigation so the
   browser morphs it into the product page's main image. */
document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href*="product.html?id="]');
    if (!link) return;
    const img = link.querySelector('img');
    if (img && img.offsetParent !== null) {
        img.style.viewTransitionName = 'product-hero';
    }
}, true);
</script>

<script>
/* PAGE PEEL — cover on product click, peel away on arrival */
(function () {
    const layer = document.createElement('div');
    layer.id = 'peelLayer';
    document.body.appendChild(layer);

    // Arriving from a peel? Start covered, then peel back to the corner.
    if (sessionStorage.getItem('peelIn') === '1') {
        sessionStorage.removeItem('peelIn');
        layer.classList.add('instant', 'cover');
        requestAnimationFrame(() => requestAnimationFrame(() => {
            layer.classList.remove('instant');
            layer.classList.remove('cover');
        }));
    }

    // Product clicks: sweep the corner over the page, then navigate.
    document.addEventListener('click', (e) => {
        if (e.defaultPrevented) return;
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        const link = e.target.closest('a[href*="product.html?id="]');
        if (!link || link.target === '_blank') return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; // instant nav
        e.preventDefault();
        sessionStorage.setItem('peelIn', '1');
        layer.classList.add('cover');
        setTimeout(() => { window.location.href = link.href; }, 520);
    }, true);
    // Returning via back/forward: never stay covered
    window.addEventListener('pageshow', (ev) => {
        if (ev.persisted) {
            layer.classList.add('instant');
            layer.classList.remove('cover');
            requestAnimationFrame(() => layer.classList.remove('instant'));
        }
    });
})();

</script>
</body>
