<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Product Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* =========================================================
   LUXE DARK-GOLD THEME — products page override layer.
   Matches the new homepage. style.css stays untouched.
   ========================================================= */
body { background: #0d0b08 !important; color: #e9e2d4; }

.top-header {
    background: rgba(13,11,8,0.92) !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(212,175,106,0.16) !important;
    box-shadow: none !important;
}
.hamburger-btn, .search-icon-btn {
    background: rgba(255,255,255,0.06) !important;
    border: 1px solid rgba(212,175,106,0.4) !important;
    color: #f2ecdf !important;
}
.hamburger-btn:hover, .search-icon-btn:hover {
    background: rgba(212,175,106,0.12) !important;
    border-color: rgba(212,175,106,0.9) !important;
}
.search-input-hidden { background: #15130e !important; border-color: rgba(212,175,106,0.3) !important; color: #f2ecdf !important; }

.drawer { background: #0f0d09 !important; }
.drawer-head { border-bottom: 1px solid rgba(212,175,106,0.16) !important; }
.drawer-logo, .drawer-close-btn { color: #f2ecdf !important; }
.drawer-close-btn { background: rgba(255,255,255,0.06) !important; border: 1px solid rgba(212,175,106,0.4) !important; }
.drawer-link { color: #cfc8bb !important; }
.drawer-link:hover, .drawer-link.active { background: #17140e !important; color: #d4af6a !important; }

/* Category story circles */
.category-stories { background: #0d0b08 !important; border-bottom: 1px solid rgba(212,175,106,0.12) !important; }
.story-circle { border-color: rgba(212,175,106,0.45) !important; background: #15130e; }
.story-circle.active { border-color: #d4af6a !important; box-shadow: 0 0 14px rgba(212,175,106,0.3); }
.story-label { color: #a89a7c !important; }
.story-circle.all-circle { background: #15130e !important; color: #d4af6a !important; }
/* Brand letter inside the story circles */
.brand-letter {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 24px;
    color: #d4af6a;
}
.brand-letter-all { font-size: 12px; letter-spacing: 1.5px; }
.story-circle.active .brand-letter { color: #f0d9a8; }

/* ============ STORIES (admin-managed, top of page) ============ */
.stories-row {
    display: flex;
    gap: 14px;
    padding: 12px 14px 4px;
    overflow-x: auto;
    scrollbar-width: none;
}
.stories-row::-webkit-scrollbar { display: none; }
.story-c { flex-shrink: 0; text-align: center; cursor: pointer; width: 68px; text-decoration: none; display: block; }
.story-c-ring {
    position: relative;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto;
}
.story-c-ring::before {
    content: "";
    position: absolute;
    inset: -30%;
    background: conic-gradient(#d4af6a, #f0d9a8, #e0342e, #d4af6a);
    animation: storyRing 3s linear infinite;
}
.story-c-inner { position: absolute; inset: 2.5px; border-radius: 50%; background: #0d0b08; }
.story-c-img {
    position: absolute;
    inset: 5.5px;
    width: calc(100% - 11px);
    height: calc(100% - 11px);
    border-radius: 50%;
    object-fit: cover;
}
.story-c-label {
    font-size: 10px;
    color: #f2ecdf;
    margin-top: 4px;
    max-width: 68px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
@keyframes storyRing { to { transform: rotate(360deg); } }



/* Toolbar + filter button */
.toolbar-row {
    background: #0d0b08 !important;
    display: block !important;
}
.toolbar-row .results-count { margin-bottom: 8px; }
.results-count { color: #8f897d !important; }
/* =========================================================
   M5 CHAPTER MENU — side drawer, editorial chapter rows
   ========================================================= */
.drawer {
    position: fixed !important;
    top: 0 !important; bottom: 0 !important; left: 0 !important;
    width: 78% !important;
    max-width: 340px !important;
    height: 100% !important;
    background: #070605 !important;
    border: none !important;
    border-right: 1px solid rgba(212,175,106,0.35) !important;
    box-shadow: 14px 0 34px rgba(0,0,0,0.6) !important;
    display: flex !important;
    flex-direction: column;
    padding: 0 !important;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(.65,0,.3,1) !important;
    z-index: 2002 !important;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px !important;
    border-bottom: 1px solid rgba(212,175,106,0.25) !important;
    background: transparent !important;
}
.drawer-logo { font-size: 13px !important; letter-spacing: 2px !important; font-weight: 700 !important; }
.drawer-logo .dl-red { color: #e0342e; }
.drawer-logo .dl-white { color: #ffffff; }
.drawer-close-btn {
    background: none !important;
    border: 1px solid rgba(212,175,106,0.45) !important;
    border-radius: 50% !important;
    width: 32px; height: 32px;
    color: #f2ecdf !important;
    display: flex !important; align-items: center; justify-content: center;
}
.drawer-nav {
    flex: 1;
    overflow-y: auto;
    padding: 4px 18px 0 !important;      /* categories start right under the header */
    counter-reset: chap;
    display: block;
}
.drawer-nav .drawer-link {
    counter-increment: chap;
    position: relative;
    display: flex !important;
    align-items: center;
    gap: 0 !important;
    padding: 17px 2px 17px 30px !important;
    border-bottom: 1px solid rgba(212,175,106,0.22) !important;   /* underline after each category */
    font-family: Georgia, 'Times New Roman', serif !important;
    font-size: 21px !important;
    color: #f2ecdf !important;
    background: none !important;
    opacity: 0;
    transform: translateY(12px);
}
.drawer.open .drawer-link { animation: chapIn 0.5s cubic-bezier(.3,.8,.3,1) forwards; }
.drawer.open .drawer-link:nth-child(1) { animation-delay: 0.08s; }
.drawer.open .drawer-link:nth-child(2) { animation-delay: 0.15s; }
.drawer.open .drawer-link:nth-child(3) { animation-delay: 0.22s; }
.drawer.open .drawer-link:nth-child(4) { animation-delay: 0.29s; }
.drawer.open .drawer-link:nth-child(5) { animation-delay: 0.36s; }
.drawer.open .drawer-link:nth-child(6) { animation-delay: 0.43s; }
@keyframes chapIn { to { opacity: 1; transform: none; } }
.drawer-link::before {
    content: counter(chap, decimal-leading-zero);   /* ghost chapter number */
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-56%);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 34px;
    font-weight: 700;
    color: rgba(212,175,106,0.13);
    pointer-events: none;
}
.drawer-link::after {
    content: '\2192';                              /* right-side arrow */
    margin-left: auto;
    font-size: 17px;
    color: rgba(212,175,106,0.55);
    transition: transform 0.3s ease, color 0.3s ease;
}
.drawer-link:hover::after, .drawer-link.active::after { transform: translateX(5px); color: #f0d9a8; }
.drawer-link.active { color: #f0d9a8 !important; }
.drawer-link .drawer-icon { display: none !important; }
.drawer-wa {
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(212,175,106,0.25);
    display: flex;
}
.drawer-wa .wa-aurora { flex: 1; }
.drawer-wa .wa-aurora-inner { justify-content: center; }

/* SHOP BANNER CAROUSEL — admin photos between categories and toolbar */
.shop-banner {
    position: relative;
    margin: 12px 14px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(212,175,106,0.35);
    box-shadow: 0 12px 26px rgba(0,0,0,0.4);
}
.shop-banner-track {
    display: flex;
    transition: transform 0.55s cubic-bezier(.25,.8,.3,1);
}
.shop-banner-slide {
    flex: 0 0 100%;
    display: block;
    line-height: 0;
}
.shop-banner-slide img {
    width: 100%;
    aspect-ratio: 5 / 2;
    object-fit: cover;
    display: block;
}
/* Manual heights from admin (0 = auto 5:2). JS sets the vars + classes. */
.shop-banner.sb-fixed-m .shop-banner-slide img {
    aspect-ratio: auto;
    height: var(--sb-h-m);
}
@media (min-width: 900px) {
    .shop-banner.sb-fixed-d .shop-banner-slide img {
        aspect-ratio: auto;
        height: var(--sb-h-d);
    }
    .shop-banner.sb-fixed-m:not(.sb-fixed-d) .shop-banner-slide img {
        aspect-ratio: 5 / 2;
        height: auto;
    }
}
.shop-banner-dots {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 2;
}
.shop-banner-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.3s ease, width 0.3s ease;
}
.shop-banner-dot.active { background: #f0d9a8; width: 16px; border-radius: 3px; }
@media (min-width: 900px) {
    .shop-banner { max-width: 1160px; margin: 14px auto 0; }
}

/* SLIDING SEGMENT — pill bar under the category circles */
#segRow { padding: 2px 14px 4px; }
.seg-bar {
    position: relative;
    display: flex;
    width: 100%;
    background: #12100b;
    border: 1px solid rgba(212,175,106,0.35);
    border-radius: 999px;
    padding: 4px;
    overflow-x: auto;
    scrollbar-width: none;
}
.seg-bar::-webkit-scrollbar { display: none; }
.seg-slider {
    position: absolute;
    top: 4px; bottom: 4px; left: 4px;
    border-radius: 999px;
    background: linear-gradient(140deg, #d4af6a, #b8903f);
    box-shadow: 0 4px 14px rgba(212,175,106,0.35);
    transition: transform 0.4s cubic-bezier(.6,0,.3,1), width 0.4s cubic-bezier(.6,0,.3,1), opacity 0.2s;
    opacity: 0;
    z-index: 0;
}
.seg-btn {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-width: max-content;
    text-align: center;
    background: none;
    border: none;
    padding: 10px 10px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #cfc8bb;
    white-space: nowrap;
    cursor: pointer;
    border-radius: 999px;
    transition: color 0.3s;
    font-family: inherit;
    text-transform: uppercase;
}
.seg-btn.active { color: #1a1508; font-weight: 700; }
.seg-btn:not(.active):hover { color: #f0d9a8; }
@media (max-width: 400px) {
    .seg-btn { font-size: 10px; letter-spacing: 1px; padding: 9px 6px; }
}

/* F3 GLASS + PULSING ICON — matches the WhatsApp capsule's anatomy */
.filter-toggle-btn {
    background: rgba(23,20,14,0.85) !important;
    border: 1px solid rgba(212,175,106,0.5) !important;
    color: #f2ecdf !important;
    box-shadow: none !important;
    border-radius: 999px !important;
    display: inline-flex !important;
    align-items: center;
    gap: 7px;
    padding: 7px 15px 7px 8px !important;
    letter-spacing: 1px;
    flex-shrink: 0;
}
.filter-toggle-btn:hover { border-color: #d4af6a !important; background: rgba(212,175,106,0.1) !important; }
.filter-ic-disc {
    width: 19px; height: 19px; border-radius: 50%;
    background: linear-gradient(140deg, #d4af6a, #b8903f);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    animation: filterIcPulse 2s infinite;
}
@keyframes filterIcPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,106,0.55); }
    70% { box-shadow: 0 0 0 7px rgba(212,175,106,0); }
}
.filter-toggle-btn > svg { display: none; } /* legacy inline funnel (if cached markup) */
.filter-wa-row {
    display: flex !important;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
}
.filter-wa-row .wa-aurora { flex: 1; min-width: 0; }
.filter-wa-row .wa-aurora-inner { justify-content: center; padding: 7px 10px; }
.filter-wa-row .wa-aurora-text { overflow: hidden; text-overflow: ellipsis; }

/* Product cards */
.card {
    background: #15130e !important;
    border: 1px solid rgba(212,175,106,0.18) !important;
    border-radius: 10px !important;
    box-shadow: 0 10px 22px rgba(0,0,0,0.35) !important;
}
.card:hover { transform: translateY(-4px); border-color: rgba(212,175,106,0.6) !important; }
.card-img-wrap { background: #100e0a !important; }
.card-body { background: #15130e !important; }
.card-body .brand-label { color: #8f897d !important; }
.card-body h3 { color: #f2ecdf !important; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
.card-body .price { color: #d4af6a !important; }
.badge-pill, .card .tag, .card-body .tag, .meta .tag {
    background: #000 !important;
    color: #d4af6a !important;
    border: 1px solid rgba(212,175,106,0.3) !important;
}
.card-wishlist-btn { background: rgba(13,11,8,0.7) !important; color: #f2ecdf !important; }
.card-wishlist-btn.active { background: #e0342e !important; }

/* Filter drawer */
.filter-drawer { background: #0f0d09 !important; }
.filter-drawer-head { background: #0f0d09 !important; border-bottom: 1px solid rgba(212,175,106,0.16) !important; color: #f2ecdf !important; }
.filter-drawer-head span { color: #f2ecdf !important; }
.filter-drawer-close { color: #f2ecdf !important; }
.filter-drawer-body { background: #0f0d09 !important; }
.fd-section { border-bottom: 1px solid rgba(212,175,106,0.12) !important; }
.fd-section-head { color: #e9e2d4 !important; }
.fd-chevron { color: #a89a7c !important; }
.fd-option { color: #cfc8bb !important; }
.fd-option input[type="checkbox"] { accent-color: #d4af6a; }
.fd-count { color: #8f897d !important; }
.fd-show-more { color: #d4af6a !important; }
.fd-clear-btn { color: #d4af6a !important; border-color: rgba(212,175,106,0.5) !important; background: transparent !important; }
.filter-drawer-footer { background: #0f0d09 !important; border-top: 1px solid rgba(212,175,106,0.16) !important; }
.filter-drawer-footer button { background: #e0342e !important; color: #fff !important; }

/* Load more + footer */
.load-more-btn {
    background: transparent !important;
    border: 1px solid rgba(212,175,106,0.6) !important;
    color: #f2ecdf !important;
    letter-spacing: 1px;
}
.load-more-btn:hover { background: rgba(212,175,106,0.12) !important; }
.footer-brand-banner { background: #000 !important; border-top: 1px solid rgba(212,175,106,0.18) !important; }
.site-footer { background: #000 !important; }
.footer-brand-copy { color: #8f897d !important; }
.footer-brand-copyright { color: #5b564c !important; }

/* HIDE ALL PRICES (site-wide request) */
.card-body .price, .search-suggest-price, .price-row .price { display: none !important; }

/* =========================================================
   PRODUCT-OPEN TRANSITION (View Transitions API)
   The tapped product image morphs into the product page's
   main image. Browsers without support fall back to normal
   instant navigation — nothing breaks.
   ========================================================= */
@view-transition { navigation: auto; }
::view-transition-group(product-hero) {
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(.25,.9,.3,1);
}
::view-transition-old(product-hero), ::view-transition-new(product-hero) {
    height: 100%;
    object-fit: cover;
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.3s; }

/* =========================================================
   PAGE PEEL transition (product open)
   A gold-edged "page corner" sweeps from the bottom-right,
   covers the screen, the next page loads, then it peels back
   away to the corner. Runs alongside the image-fly morph.
   ========================================================= */
#peelLayer {
    position: fixed;
    right: 0; bottom: 0;
    width: 260vmax; height: 260vmax;
    z-index: 99999;
    pointer-events: none;
    background: linear-gradient(315deg,
        #171310 0%, #171310 46%,
        #3a3020 48%, #c9a35d 50%, #f0d9a8 51%, #c9a35d 52%,
        #12100b 54%, #0d0b08 100%);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    box-shadow: -14px -14px 40px rgba(0,0,0,0.65);
    /* transform-based = GPU compositing, no layout work per frame */
    transform: scale(0);
    transform-origin: bottom right;
    transition: transform 0.55s cubic-bezier(.65, 0, .35, 1);
    will-change: transform;
}
#peelLayer.cover { transform: scale(1); }
#peelLayer.instant { transition: none; }

/* =========================================================
   ACCESSIBILITY: respect "reduce motion" system setting
   ========================================================= */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
        scroll-behavior: auto !important;
    }
    #peelLayer { display: none !important; }
}

/* =========================================================
   OFFER BANNER + FLOATING WHATSAPP (products page)
   ========================================================= */
/* AURORA RING — WhatsApp capsule banner: the border is flowing
   green-and-gold light streaming endlessly around the pill. */
/* (banner moved into the toolbar row beside Filter) */
/* GREEN + SHINE SWEEP — solid WhatsApp-green pill with a white
   shine slicing across (same language as the product-page banner) */
.wa-aurora {
    position: relative;
    display: inline-block;
    border-radius: 999px;
    overflow: hidden;
    text-decoration: none;
    max-width: 100%;
}
.wa-aurora-spin {
    position: absolute;
    top: -40%;
    bottom: -40%;
    left: 0;
    width: 38%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: waAuroraShine 3.5s linear infinite;
    pointer-events: none;
    z-index: 1;
    will-change: transform;
}
@keyframes waAuroraShine {
    0%, 55% { transform: translateX(-160%) skewX(-18deg); }
    90%, 100% { transform: translateX(420%) skewX(-18deg); }
}
@media (prefers-reduced-motion: reduce) {
    .wa-aurora-spin { animation: none; opacity: 0; }
}
.wa-aurora-inner {
    position: relative;
    display: flex; align-items: center; gap: 9px;
    background: linear-gradient(135deg, #22c15e, #128c46);
    border-radius: 999px;
    padding: 10px 20px;
    white-space: nowrap;
}
.wa-aurora-ic {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    animation: waAuroraPulse 2s infinite;
}
@keyframes waAuroraPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.45); }
    70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
}
.wa-aurora-ic svg { width: 12px; height: 12px; fill: #fff; }
.wa-aurora-text {
    font-size: 11px;
    letter-spacing: 2px;
    color: #ffffff;
}
.wa-aurora-text b { color: #ffffff; font-weight: 700; }
.wa-aurora-text em { color: #d4af6a; font-style: normal; }
@media (max-width: 480px) {
    .wa-aurora-inner { padding: 9px 14px; gap: 7px; }
    .wa-aurora-text { font-size: 9.5px; letter-spacing: 1.2px; }
}

/* ---------- DESKTOP refinement (same design, polished) ---------- */
@media (min-width: 900px) {
    /* Bigger desktop filter sidebar: wider and taller, starts right
       under the header so the brand list needs far less scrolling */
    .filter-drawer {
        width: 280px !important;
        top: 60px !important;
        max-height: calc(100vh - 72px) !important;
    }
    .fd-section-body { max-height: none !important; }

    /* Toolbar row lives inside the grid column on desktop (moved by
       products.js): count + WhatsApp capsule sit beside the filter */
    .page-layout .toolbar-row { padding: 0 0 14px !important; }
    .page-layout .toolbar-row .wa-aurora { display: block; }
}

@media (min-width: 769px) {
    /* No Filter button on desktop — the capsule owns the row */
    .filter-toggle-btn { display: none !important; }

    /* Desktop: same green fill + white shine, just a soft green halo */
    .wa-aurora {
        box-shadow: 0 0 18px rgba(37,211,102,0.2);
    }
    .wa-aurora-inner { padding: 9px 20px; gap: 10px; }
    .wa-aurora-ic { width: 21px; height: 21px; }
    .wa-aurora-ic svg { width: 12px; height: 12px; }
    .wa-aurora-text { font-size: 11.5px; letter-spacing: 2.5px; }
}
 }


</style>

<body>

<div class="top-header">
    <div class="title-row">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="logo-wrap">
            <a href="index.html"><img src="assets/logo.png" alt="3rd Party — Masters of Style" class="site-logo"></a>
        </div>

        <form class="search-box" id="searchBox">

<script>
/* Name the tapped product image just before navigation so the
   browser morphs it into the product page's main image. */
document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href*="product.html?id="]');
    if (!link) return;
    const img = link.querySelector('img');
    if (img && img.offsetParent !== null) {
        img.style.viewTransitionName = 'product-hero';
    }
}, true);
</script>

<script>
/* PAGE PEEL — cover on product click, peel away on arrival */
(function () {
    const layer = document.createElement('div');
    layer.id = 'peelLayer';
    document.body.appendChild(layer);

    // Arriving from a peel? Start covered, then peel back to the corner.
    if (sessionStorage.getItem('peelIn') === '1') {
        sessionStorage.removeItem('peelIn');
        layer.classList.add('instant', 'cover');
        requestAnimationFrame(() => requestAnimationFrame(() => {
            layer.classList.remove('instant');
            layer.classList.remove('cover');
        }));
    }

    // Product clicks: sweep the corner over the page, then navigate.
    document.addEventListener('click', (e) => {
        if (e.defaultPrevented) return;
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        const link = e.target.closest('a[href*="product.html?id="]');
        if (!link || link.target === '_blank') return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; // instant nav
        e.preventDefault();
        sessionStorage.setItem('peelIn', '1');
        layer.classList.add('cover');
        setTimeout(() => { window.location.href = link.href; }, 520);
    }, true);
    // Returning via back/forward: never stay covered
    window.addEventListener('pageshow', (ev) => {
        if (ev.persisted) {
            layer.classList.add('instant');
            layer.classList.remove('cover');
            requestAnimationFrame(() => layer.classList.remove('instant'));
        }
    });
})();

</script>

<script>
// Photo banner (admin-managed): uploads/banner/banner.json -> {image, link, ts}
(function () {
    var API = 'https://fourpirates.tmfragrance.com/visitor/product-api';
    var a = document.getElementById('photoBanner');
    var img = document.getElementById('photoBannerImg');
    if (!a || !img) return;
    fetch(API + '/uploads/banner/banner.json?v=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (b) {
            if (!b || !b.image) return;
            img.src = API + '/uploads/banner/' + b.image + '?v=' + (b.ts || Date.now());
            img.onload = function () { a.style.display = ''; };
            if (b.link) {
                a.href = b.link;
                if (/^https?:/i.test(b.link) && b.link.indexOf(location.host) === -1) {
                    a.target = '_blank'; a.rel = 'noopener';
                }
            } else {
                a.removeAttribute('href');
            }
        })
        .catch(function () { /* no banner uploaded — stays hidden */ });
})();
</script>
