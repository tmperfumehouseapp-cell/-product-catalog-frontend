<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Product video gallery thumb — sized by JS to exactly match the image
   thumbs next to it (style.css controls those), so they always align. */
.gallery-thumb-video {
    width: 60px; height: 60px; /* fallback only — JS overrides */
    border-radius: 10px; background: #111;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    box-sizing: border-box;
    border: 2px solid transparent;
    vertical-align: top;
}
.gallery-thumb-video.active { border-color: #e0342e; }
.gallery-thumb-video svg { width: 40%; height: 40%; }
#mainMedia { position: relative; }
#mainMedia video.gallery-main {
    background: #000;
    object-fit: contain;
    width: 100%;
    max-width: 100%;
    display: block;
}

/* Nothing on this page may push the layout wider than the screen */
html, body { overflow-x: hidden; }

/* =========================================================
   GRID OVERFLOW CURE
   style.css's .detail-card is a CSS grid; any wide child
   (note images, videos) inflates its 1fr column past the
   viewport, cutting the whole page off on the right.
   min-width:0 stops grid items from growing to content size.
   ========================================================= */
.detail-card { max-width: 100%; }
.detail-card > * { min-width: 0; }
.detail-info { min-width: 0; max-width: 100%; }
.detail-info img, .detail-info video { max-width: 100%; }
.pspec-grid, .pspec-item { min-width: 0; }
.pspec-label, .pspec-value { overflow-wrap: anywhere; }

/* =========================================================
   NOTES SCROLLER — style.css has no rules for these classes,
   so note images rendered full-size and broke the layout.
   Horizontal scroll row, circular thumbs, arrow + fade
   affordances (shown only when the row overflows).
   ========================================================= */
.product-notes-scroll-wrap { position: relative; max-width: 100%; overflow: hidden; }
.product-notes-row {
    display: flex; gap: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 2px 8px;
}
.product-notes-row::-webkit-scrollbar { display: none; }
.product-note { flex: 0 0 auto; width: 84px; text-align: center; }
.product-note-img {
    width: 72px; height: 72px; border-radius: 50%;
    overflow: hidden; margin: 0 auto 6px; background: #f2f2f2;
}
.product-note-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.product-note-name { font-size: 12px; color: #444; margin: 0; overflow-wrap: anywhere; }

.pn-arrow {
    position: absolute; top: 34px; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid #eee; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    display: none; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; padding: 0;
}
.pn-arrow.show { display: flex; }
.pn-arrow.left { left: 0; }
.pn-arrow.right { right: 0; }
.pn-fade {
    position: absolute; top: 0; bottom: 0; width: 32px;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 1;
}
.pn-fade.show { opacity: 1; }
.pn-fade.left { left: 0; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
.pn-fade.right { right: 0; background: linear-gradient(to left, #fff, rgba(255,255,255,0)); }

/* =========================================================
   MOBILE GALLERY (≤767px): square media box + tidy thumb row.
   Keeps portrait/landscape images and videos from blowing up
   the page height; desktop keeps style.css sizing untouched.
   ========================================================= */
@media (max-width: 767px) {
    #mainMedia {
        width: 100%;
        aspect-ratio: 1 / 1;   /* consistent square stage */
        overflow: hidden;
        background: #f5f5f5;
    }
    #mainMedia img.gallery-main {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;     /* fills the square, crops edges */
        display: block;
    }
    #mainMedia video.gallery-main {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;   /* whole video visible, letterboxed */
    }
    .gallery-thumbs {
        display: flex !important;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 2px;
        -webkit-overflow-scrolling: touch;
    }
    .gallery-thumbs img,
    .gallery-thumb-video {
        width: 56px !important;
        height: 56px !important;
        min-width: 56px !important;
        border-radius: 10px !important;
        object-fit: cover;
        flex: 0 0 auto;
    }
}

/* Specifications grid (category metafields) */
.pspec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pspec-item {
    display: flex; flex-direction: column; gap: 5px;
    background: #f7f7f7; border-radius: 10px; padding: 12px 14px;
}
.pspec-item svg { width: 18px; height: 18px; stroke: #e0342e; }
.pspec-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.pspec-value { font-size: 13px; font-weight: 600; color: #1a1a1a; }
@media (min-width: 640px) { .pspec-grid { grid-template-columns: repeat(3, 1fr); } }

/* HIDE ALL PRICES (site-wide request) */
.detail-price, .search-suggest-price, .related-card-price { display: none !important; }

/* =========================================================
   PRODUCT-OPEN TRANSITION (View Transitions API)
   The tapped product image morphs into the product page's
   main image. Browsers without support fall back to normal
   instant navigation — nothing breaks.
   ========================================================= */
@view-transition { navigation: auto; }
::view-transition-group(product-hero) {
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(.25,.9,.3,1);
}
::view-transition-old(product-hero), ::view-transition-new(product-hero) {
    height: 100%;
    object-fit: cover;
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.3s; }

/* The product page's main image is the landing spot of the morph */
#mainImage.gallery-main { view-transition-name: product-hero; }

/* Main product image: natural ratio — full photo, no crop, no bands */
#mainMedia img.gallery-main {
    width: 100%;
    height: auto !important;
    aspect-ratio: auto;
    object-fit: contain;
    display: block;
}

/* =========================================================
   PAGE PEEL transition (product open)
   A gold-edged "page corner" sweeps from the bottom-right,
   covers the screen, the next page loads, then it peels back
   away to the corner. Runs alongside the image-fly morph.
   ========================================================= */
#peelLayer {
    position: fixed;
    right: 0; bottom: 0;
    width: 260vmax; height: 260vmax;
    z-index: 99999;
    pointer-events: none;
    background: linear-gradient(315deg,
        #171310 0%, #171310 46%,
        #3a3020 48%, #c9a35d 50%, #f0d9a8 51%, #c9a35d 52%,
        #12100b 54%, #0d0b08 100%);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    box-shadow: -14px -14px 40px rgba(0,0,0,0.65);
    /* transform-based = GPU compositing, no layout work per frame */
    transform: scale(0);
    transform-origin: bottom right;
    transition: transform 0.55s cubic-bezier(.65, 0, .35, 1);
    will-change: transform;
}
#peelLayer.cover { transform: scale(1); }
#peelLayer.instant { transition: none; }
</style>

<script>
const API_BASE = 'https://fourpirates.tmfragrance.com/visitor/product-api';
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const wrap = document.getElementById('detailWrap');

const hamburgerBtn = document.getElementById('hamburgerBtn');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerClose = document.getElementById('drawerClose');
const searchBox = document.getElementById('searchBox');
const searchToggle = document.getElementById('searchToggle');
const searchInput = document.getElementById('searchInput');
const titleRow = document.querySelector('.title-row');

function openDrawer() {
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
}
function closeDrawer() {
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
}
hamburgerBtn.addEventListener('click', openDrawer);
drawerClose.addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

function runHeaderSearch() {
    const term = searchInput.value.trim();
    if (term) {
        window.location.href = 'products.html?search=' + encodeURIComponent(term);
    }
}

searchToggle.addEventListener('click', (e) => {
    const isExpanded = searchBox.classList.contains('expanded');
    const hasValue = !!searchInput.value.trim();

    if (isExpanded && hasValue) {
        return; // let the form's submit handler below run the search
    }

    e.preventDefault();
    const expanding = !isExpanded;
    searchBox.classList.toggle('expanded');
    titleRow.classList.toggle('search-open', expanding);
    if (expanding) {
        searchInput.focus();
    } else {
        searchInput.blur();
    }
});
if (searchBox.tagName === 'FORM') {
    searchBox.addEventListener('submit', (e) => {
        e.preventDefault();
        runHeaderSearch();
    });
}
document.addEventListener('click', (e) => {
    if (!searchBox.contains(e.target) && !searchInput.value) {
        searchBox.classList.remove('expanded');
        titleRow.classList.remove('search-open');
    }
});
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        runHeaderSearch();
    }
});

/*
 * Live autosuggest: as the person types (2+ characters), fetch matching
 * products and show a small dropdown under the search box.
 */
const searchSuggest = document.getElementById('searchSuggest');
let suggestDebounceTimer;

function closeSuggest() {
    if (searchSuggest) {
        searchSuggest.classList.remove('open');
        searchSuggest.innerHTML = '';
    }
}

async function runSuggest(term) {
    if (!searchSuggest) return;

    try {
        const res = await fetch(`${API_BASE}/get_products.php?search=${encodeURIComponent(term)}&page=1`);
        const data = await res.json();

        if (!data.success) {
            closeSuggest();
            return;
        }

        const items = (data.products || []).slice(0, 6);

        if (!items.length) {
            searchSuggest.innerHTML = `<div class="search-suggest-empty">No matches for "${escapeHtml(term)}"</div>`;
            searchSuggest.classList.add('open');
            return;
        }

        const priceOf = (typeof formatPrice === 'function')
            ? formatPrice
            : (price) => 'Rs. ' + Math.round(price).toLocaleString('en-IN');

        const itemsHtml = items.map(p => `
            <a class="search-suggest-item" href="product.html?id=${p.id}">
                <img src="${p.image ? escapeHtml(p.image) : ''}" alt="" loading="lazy" onerror="this.style.opacity=0">
                <span class="search-suggest-name">${escapeHtml(p.name)}</span>
                <span class="search-suggest-price">${priceOf(p.price)}</span>
            </a>
        `).join('');

        searchSuggest.innerHTML = itemsHtml + `<a class="search-suggest-viewall" href="products.html?search=${encodeURIComponent(term)}">View all results for "${escapeHtml(term)}"</a>`;
        searchSuggest.classList.add('open');
    } catch (e) {
        closeSuggest();
    }
}

searchInput.addEventListener('input', () => {
    clearTimeout(suggestDebounceTimer);
    const term = searchInput.value.trim();

    if (term.length < 2) {
        closeSuggest();
        return;
    }

    suggestDebounceTimer = setTimeout(() => runSuggest(term), 250);
});

searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') closeSuggest();
});

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatPrice(price) {
    return 'Rs. ' + Math.round(price).toLocaleString('en-IN');

function clearMediaActive() {

}

/*
 * Make the video play-tile exactly the same size as the image thumbs
 * beside it (whatever size style.css gives them, on any screen size).
 */
function syncVideoThumbSize() {
    if (window.innerWidth < 768) return; // mobile size is fixed in CSS
    const vThumb = document.querySelector('.gallery-thumb-video');
    if (!vThumb) return;
    const imgThumb = document.querySelector('.gallery-thumbs img');
    if (!imgThumb) return;
    const r = imgThumb.getBoundingClientRect();
    if (r.width > 10 && r.height > 10) {
        vThumb.style.width = r.width + 'px';
        vThumb.style.height = r.height + 'px';
        vThumb.style.borderRadius = getComputedStyle(imgThumb).borderRadius;
    }
}
window.addEventListener('resize', syncVideoThumbSize);

function switchImage(src, thumbEl) {
    const mm = document.getElementById('mainMedia');
    if (mm) {
        mm.style.height = '';
        mm.innerHTML = `<img id="mainImage" class="gallery-main" src="${src}" alt="">`;
    }
    clearMediaActive();
    thumbEl.classList.add('active');
}

function switchVideo(src, thumbEl) {
    const mm = document.getElementById('mainMedia');
    if (mm) {
        // Desktop: freeze the height the image had so layout doesn't jump.
        // Mobile (≤767px): the CSS square stage already fixes the size.
        if (window.innerWidth >= 768) {
            const h = mm.offsetHeight;
            if (h > 50) mm.style.height = h + 'px';
        }
        // Product photo as poster so the frame is never a blank black box
        // while the video loads; if the video fails, jump back to the photo.
        const posterSrc = (window.__galleryImages && window.__galleryImages[0]) || '';
        mm.innerHTML = `<video class="gallery-main" src="${src}"${posterSrc ? ` poster="${posterSrc}"` : ''} controls autoplay muted loop playsinline style="height:100%;"></video>`;
        const vid = mm.querySelector('video');
        vid.addEventListener('error', () => {
            const firstThumb = document.querySelector('.gallery-thumbs img');
            if (firstThumb) switchImage(firstThumb.src, firstThumb);
        }, { once: true });
    }
    clearMediaActive();
    thumbEl.classList.add('active');
}

    const kind = p.details_kind;
    const details = p.details;

    wrapEl.style.display = 'block';
}

function initNotesScroller() {
    const row = document.getElementById('productNotesRow');
    const fadeLeft = document.getElementById('pnFadeLeft');
    const fadeRight = document.getElementById('pnFadeRight');
    const arrowLeft = document.getElementById('pnArrowLeft');
    const arrowRight = document.getElementById('pnArrowRight');
    if (!row) return;

    function updateAffordances() {
        const hasOverflow = row.scrollWidth > row.clientWidth + 2;
        const atStart = row.scrollLeft <= 2;
        const atEnd = row.scrollLeft >= row.scrollWidth - row.clientWidth - 2;

        fadeLeft.classList.toggle('show', hasOverflow && !atStart);
        fadeRight.classList.toggle('show', hasOverflow && !atEnd);
        arrowLeft.classList.toggle('show', hasOverflow && !atStart);
        arrowRight.classList.toggle('show', hasOverflow && !atEnd);
    }

    arrowLeft.addEventListener('click', () => row.scrollBy({ left: -180, behavior: 'smooth' }));
    arrowRight.addEventListener('click', () => row.scrollBy({ left: 180, behavior: 'smooth' }));
    row.addEventListener('scroll', updateAffordances);
    window.addEventListener('resize', updateAffordances);

    // Run once layout settles (images loading can change scrollWidth)
    requestAnimationFrame(updateAffordances);
    setTimeout(updateAffordances, 300);
}

async function loadProductNotes(productId) {
    const section = document.getElementById('productNotes');
    const row = document.getElementById('productNotesRow');
    if (!productId) return;

    try {
        const res = await fetch(`${API_BASE}/get_product_notes.php?product_id=${encodeURIComponent(productId)}`);
        const data = await res.json();
        if (!data.success || !data.notes || data.notes.length === 0) return;

        row.innerHTML = data.notes.map(n => `
            <div class="product-note">
                <div class="product-note-img">
                    <img src="${escapeHtml(n.image)}" alt="${escapeHtml(n.name)}" loading="lazy" onerror="this.style.opacity=0">
                </div>
                <p class="product-note-name">${escapeHtml(n.name)}</p>
            </div>
        `).join('');
        section.style.display = 'block';
        initNotesScroller();
    } catch (err) {
        // fine — notes section just stays hidden if this fails
    }
}

async function loadRelatedByBrand(brand, currentId, category) {
    const section = document.getElementById('relatedProducts');
    const scroll = document.getElementById('relatedScroll');
    const brandNameEl = document.getElementById('relatedBrandName');

    const normalize = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const targetNorm = normalize(brand);

    try {
        let allProducts = [];
        let page = 1;
        let hasMore = true;

        while (hasMore && page <= 15) {
            const res = await fetch(`${API_BASE}/get_products.php?page=${page}`);
            const data = await res.json();
            if (!data.success) break;
            allProducts = allProducts.concat(data.products);
            hasMore = !!data.hasMore;
            page++;
        }

        let items = allProducts.filter(p =>
            normalize(p.brand) === targetNorm && String(p.id) !== String(currentId)
        );

        if (items.length === 0) {
            items = allProducts.filter(p => {
                const pNorm = normalize(p.brand);
                return pNorm && String(p.id) !== String(currentId) &&
                    (pNorm.includes(targetNorm) || targetNorm.includes(pNorm));
            });
        }

        // Still nothing from this brand? Suggest from the same category
        // so every product always shows suggestions.
        let headingName = brand;
        if (items.length === 0 && category) {
            const catNorm = normalize(category);
            items = allProducts.filter(p =>
                normalize(p.category) === catNorm && String(p.id) !== String(currentId)
            ).sort(() => Math.random() - 0.5);
            headingName = category;
        }

        // Shuffle every time so suggestions feel fresh on each visit
        items = items.sort(() => Math.random() - 0.5).slice(0, 5);
        if (items.length === 0) return;

        brandNameEl.textContent = headingName;
        scroll.innerHTML = items.map(p => `
            <a class="related-card" href="product.html?id=${p.id}">
                <div class="related-card-img">
                    <img src="${p.image ? escapeHtml(p.image) : ''}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.style.opacity=0">
                </div>
                <p class="related-card-name">${escapeHtml(p.name)}</p>
            </a>
        `).join('');
        section.style.display = 'block';

        function updateActiveRelatedCard() {
            const cards = scroll.querySelectorAll('.related-card');
            if (!cards.length) return;
            if (window.innerWidth >= 640) {
                cards.forEach(c => c.classList.remove('rc-active'));
                return;
            }
            const mid = scroll.scrollLeft + scroll.clientWidth / 2;
            let closest = cards[0];
            let closestDist = Infinity;
            cards.forEach(c => {
                const cardMid = c.offsetLeft + c.offsetWidth / 2;
                const dist = Math.abs(mid - cardMid);
                if (dist < closestDist) { closestDist = dist; closest = c; }
            });
            cards.forEach(c => c.classList.toggle('rc-active', c === closest));
        }
        scroll.addEventListener('scroll', updateActiveRelatedCard);
        window.addEventListener('resize', updateActiveRelatedCard);
        updateActiveRelatedCard();
    } catch (err) {
    }
}
</script>


<script>
/* Name the tapped product image just before navigation so the
   browser morphs it into the product page's main image. */
document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href*="product.html?id="]');
    if (!link) return;
    const img = link.querySelector('img');
    if (img && img.offsetParent !== null) {
        img.style.viewTransitionName = 'product-hero';
    }
}, true);
</script>

<script>
/* Smart back: return to the exact page you came from (category list,
   search results, homepage) instead of always the homepage. Direct
   visits (no history) fall back to the products catalog. */
// Delegated: works even though the back buttons render after the
// product data loads.
document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-smart-back]');
    if (!btn) return;
    const cameFromSite = document.referrer &&
        new URL(document.referrer).origin === window.location.origin;
    if (cameFromSite && window.history.length > 1) {
        e.preventDefault();
        window.history.back();
    }
    // else: normal link -> products.html?category=...
}, true);
</script>

<script>
/* PAGE PEEL — cover on product click, peel away on arrival */
(function () {
    const layer = document.createElement('div');
    layer.id = 'peelLayer';
    document.body.appendChild(layer);

    // Arriving from a peel? Start covered, then peel back to the corner.
    if (sessionStorage.getItem('peelIn') === '1') {
        sessionStorage.removeItem('peelIn');
        layer.classList.add('instant', 'cover');
        requestAnimationFrame(() => requestAnimationFrame(() => {
            layer.classList.remove('instant');
            layer.classList.remove('cover');
        }));
    }

    // Product clicks: sweep the corner over the page, then navigate.
    document.addEventListener('click', (e) => {
        if (e.defaultPrevented) return;
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        const link = e.target.closest('a[href*="product.html?id="]');
        if (!link || link.target === '_blank') return;
        e.preventDefault();
        sessionStorage.setItem('peelIn', '1');
        layer.classList.add('cover');
        setTimeout(() => { window.location.href = link.href; }, 520);
    }, true);
    // Returning via back/forward: never stay covered
    window.addEventListener('pageshow', (ev) => {
        if (ev.persisted) {
            layer.classList.add('instant');
            layer.classList.remove('cover');
            requestAnimationFrame(() => layer.classList.remove('instant'));
        }
    });
})();

</script>
