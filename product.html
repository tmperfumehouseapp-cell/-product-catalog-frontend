<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-header">
    <div class="title-row">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="logo-wrap">
            <a href="index.html"><img src="assets/logo.png" alt="3rd Party — Masters of Style" class="site-logo"></a>
        </div>

        <form class="search-box" id="searchBox">
            <input type="search" id="searchInput" placeholder="Search..." class="search-input-hidden">
            <button type="submit" class="search-icon-btn" id="searchToggle" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <div class="search-suggest" id="searchSuggest"></div>
        </form>

        <div class="header-icons"></div>
    </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer">
    <div class="drawer-head">
        <span class="drawer-logo">Product Catalog</span>
        <button class="drawer-close-btn" id="drawerClose" aria-label="Close menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="drawer-nav" id="drawerNav"></div>
</nav>

<div class="container">
    <div id="detailWrap">
        <div class="loading">Loading product...</div>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-brand-banner">
        <p class="footer-brand-copy">Authentic perfumes, sunglasses, watches, and belts, all in one place. 3rd Party brings you genuine accessories from the brands you trust, at prices that actually make sense — no compromises, just the real thing.</p>
        <img src="assets/logo-white.png" alt="3rd Party — Masters of 9A" class="footer-brand-logo">
        <p class="footer-brand-copyright">&#169; 2026, 3rd Party</p>
    </div>
</footer>

<script>
document.querySelectorAll('.footer-heading').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var body = document.getElementById(btn.dataset.target);
        var isOpen = btn.classList.toggle('open');
        if (body) body.classList.toggle('open', isOpen);
    });
});
</script>

<script>
const API_BASE = 'https://fourpirates.tmfragrance.com/visitor/product-api';
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const wrap = document.getElementById('detailWrap');

const hamburgerBtn = document.getElementById('hamburgerBtn');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerClose = document.getElementById('drawerClose');
const searchBox = document.getElementById('searchBox');
const searchToggle = document.getElementById('searchToggle');
const searchInput = document.getElementById('searchInput');
const titleRow = document.querySelector('.title-row');

function openDrawer() {
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
}
function closeDrawer() {
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
}
hamburgerBtn.addEventListener('click', openDrawer);
drawerClose.addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

function runHeaderSearch() {
    const term = searchInput.value.trim();
    if (term) {
        window.location.href = 'products.html?search=' + encodeURIComponent(term);
    }
}

searchToggle.addEventListener('click', (e) => {
    const isExpanded = searchBox.classList.contains('expanded');
    const hasValue = !!searchInput.value.trim();

    if (isExpanded && hasValue) {
        return; // let the form's submit handler below run the search
    }

    e.preventDefault();
    const expanding = !isExpanded;
    searchBox.classList.toggle('expanded');
    titleRow.classList.toggle('search-open', expanding);
    if (expanding) {
        searchInput.focus();
    } else {
        searchInput.blur();
    }
});
if (searchBox.tagName === 'FORM') {
    searchBox.addEventListener('submit', (e) => {
        e.preventDefault();
        runHeaderSearch();
    });
}
document.addEventListener('click', (e) => {
    if (!searchBox.contains(e.target) && !searchInput.value) {
        searchBox.classList.remove('expanded');
        titleRow.classList.remove('search-open');
    }
});
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        runHeaderSearch();
    }
});

/*
 * Live autosuggest: as the person types (2+ characters), fetch matching
 * products and show a small dropdown under the search box.
 */
const searchSuggest = document.getElementById('searchSuggest');
let suggestDebounceTimer;

function closeSuggest() {
    if (searchSuggest) {
        searchSuggest.classList.remove('open');
        searchSuggest.innerHTML = '';
    }
}

async function runSuggest(term) {
    if (!searchSuggest) return;

    try {
        const res = await fetch(`${API_BASE}/get_products.php?search=${encodeURIComponent(term)}&page=1`);
        const data = await res.json();

        if (!data.success) {
            closeSuggest();
            return;
        }

        const items = (data.products || []).slice(0, 6);

        if (!items.length) {
            searchSuggest.innerHTML = `<div class="search-suggest-empty">No matches for "${escapeHtml(term)}"</div>`;
            searchSuggest.classList.add('open');
            return;
        }

        const priceOf = (typeof formatPrice === 'function')
            ? formatPrice
            : (price) => 'Rs. ' + Math.round(price).toLocaleString('en-IN');

        const itemsHtml = items.map(p => `
            <a class="search-suggest-item" href="product.html?id=${p.id}">
                <img src="${p.image ? escapeHtml(p.image) : ''}" alt="" loading="lazy" onerror="this.style.opacity=0">
                <span class="search-suggest-name">${escapeHtml(p.name)}</span>
                <span class="search-suggest-price">${priceOf(p.price)}</span>
            </a>
        `).join('');

        searchSuggest.innerHTML = itemsHtml + `<a class="search-suggest-viewall" href="products.html?search=${encodeURIComponent(term)}">View all results for "${escapeHtml(term)}"</a>`;
        searchSuggest.classList.add('open');
    } catch (e) {
        closeSuggest();
    }
}

searchInput.addEventListener('input', () => {
    clearTimeout(suggestDebounceTimer);
    const term = searchInput.value.trim();

    if (term.length < 2) {
        closeSuggest();
        return;
    }

    suggestDebounceTimer = setTimeout(() => runSuggest(term), 250);
});

searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') closeSuggest();
});

document.addEventListener('click', (e) => {
    if (searchSuggest && searchBox && !searchBox.contains(e.target)) {
        closeSuggest();
    }
});

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatPrice(price) {
    return 'Rs. ' + Math.round(price).toLocaleString('en-IN');
}

function switchImage(src, thumbEl) {
    document.getElementById('mainImage').src = src;
    document.querySelectorAll('.gallery-thumbs img').forEach(t => t.classList.remove('active'));
    thumbEl.classList.add('active');
}

function selectVariant(el) {
    document.querySelectorAll('.variant-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
}

// ---- Drawer: same category list + active highlight as index.html, instead
// of a hardcoded "All Category" link. Reads the same sessionStorage key
// index.html writes to, so whatever category/brand/gender was selected there
// stays reflected here. Clicking a category takes you back to index.html
// filtered to it. ----
const FILTER_KEY = 'catalogFilters';

function loadFilterState() {
    try {
        return JSON.parse(sessionStorage.getItem(FILTER_KEY)) || null;
    } catch (e) {
        return null;
    }
}

async function loadDrawerCategories() {
    const drawerNav = document.getElementById('drawerNav');
    if (!drawerNav) return;

    try {
        const res = await fetch(`${API_BASE}/get_categories.php`);
        const data = await res.json();
        if (!data.success) return;

        const saved = loadFilterState();
        const activeCategory = saved && saved.category ? saved.category : '';

        const categoryLinks = data.categories.map(c => `
            <a class="drawer-link${activeCategory === c.category ? ' active' : ''}" href="products.html?category=${encodeURIComponent(c.category)}">
                <span class="drawer-icon">${c.thumb ? `<img src="${escapeHtml(c.thumb)}" alt="${escapeHtml(c.category)}">` : ''}</span>
                ${escapeHtml(c.category)}
            </a>
        `).join('');

        drawerNav.innerHTML = categoryLinks;
    } catch (err) {
        // Falls back to the empty drawer nav — hamburger still opens/closes fine
    }
}

loadDrawerCategories();

async function loadProduct() {
    if (!id) {
        wrap.innerHTML = '<div class="empty">No product specified.</div>';
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/get_product.php?id=${encodeURIComponent(id)}`);
        const data = await res.json();

        if (!res.ok || !data.success) {
            wrap.innerHTML = `<div class="empty">${escapeHtml(data.error || 'Product not found.')}</div>`;
            return;
        }

        const p = data.product;
        const images = p.images && p.images.length ? p.images : [];
        const mainImg = images[0] || '';
        const variants = p.variants || [];

        const thumbsHtml = images.length > 1 ? `
            <div class="gallery-thumbs">
                ${images.map((img, i) => `
                    <img src="${escapeHtml(img)}" class="${i === 0 ? 'active' : ''}"
                         onclick="switchImage('${escapeHtml(img)}', this)">
                `).join('')}
            </div>
        ` : '';

        const variantHtml = variants.length > 0 ? `
            <div class="variant-label">Quantity</div>
            <div class="variant-row">
                ${variants.map((v, i) => `
                    <span class="variant-chip ${i === 0 ? 'active' : ''}" onclick="selectVariant(this)">${escapeHtml(v)}</span>
                `).join('')}
            </div>
        ` : '';

        const descriptionHtml = p.description && p.description.trim() ? `
            <div class="description-accordion">
                <button type="button" class="description-toggle" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open');">
                    Description
                    <svg class="description-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="description-body">
                    <p class="description-card-text">${escapeHtml(p.description)}</p>
                </div>
            </div>
        ` : '';

        document.title = `${p.name} — Product Catalog`;

        wrap.innerHTML = `
            <div class="detail-card">
                <div style="position:relative;">
                    <a href="index.html" class="back-icon-btn" aria-label="Back to catalog">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </a>
                    <img id="mainImage" class="gallery-main" src="${escapeHtml(mainImg)}" alt="${escapeHtml(p.name)}">
                    ${thumbsHtml}
                </div>
                <div class="detail-info">
                    <p class="detail-brand">${escapeHtml(p.brand)}</p>
                    <h2>${escapeHtml(p.name)}</h2>
                    <div class="detail-price">${formatPrice(p.price)}</div>

                    <div class="detail-badges">
                        <span class="badge-pill">${escapeHtml(p.category)}</span>
                        <span class="badge-pill">${escapeHtml(p.gender)}</span>
                    </div>

                    ${variantHtml}

                    <div class="bundle-upsell">
                        <p class="bundle-upsell-line">Have a question before you order — stock, sizing, authenticity, anything? Send us a message and we'll get back to you fast.</p>
                        <a href="https://wa.me/919099370999?text=${encodeURIComponent('Hi, I have a question about ' + p.name)}" class="bundle-upsell-btn" target="_blank" rel="noopener">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.06-1.33A9.96 9.96 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.42-4.4-1.16l-.32-.18-3 .79.8-2.92-.2-.3A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.4-5.6c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1-.37-1.9-1.17-.7-.62-1.18-1.4-1.32-1.64-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.1.16 1.52.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
                            Ask on WhatsApp
                        </a>
                    </div>

                    ${descriptionHtml}

                    ${p.longevity ? `
                    <div class="detail-longevity" style="margin-bottom:18px;">
                        <p style="font-size:18px;font-weight:800;color:#1a1a1a;padding:16px 0;margin:0;">Longevity</p>
                        <span class="badge-pill badge-pill-longevity">⏱ ${escapeHtml(p.longevity)}</span>
                    </div>
                    ` : ''}

                    <div class="product-notes" id="productNotes" style="display:none;">
                        <p class="product-notes-heading" style="font-size:18px;font-weight:800;color:#1a1a1a;text-transform:none;letter-spacing:normal;text-align:left;padding:16px 0;margin:0 0 14px;">Notes</p>
                        <div class="product-notes-scroll-wrap">
                            <div class="pn-fade left" id="pnFadeLeft"></div>
                            <div class="pn-fade right" id="pnFadeRight"></div>
                            <button type="button" class="pn-arrow left" id="pnArrowLeft" aria-label="Scroll notes left">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                            </button>
                            <button type="button" class="pn-arrow right" id="pnArrowRight" aria-label="Scroll notes right">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </button>
                            <div class="product-notes-row" id="productNotesRow"></div>
                        </div>
                    </div>

                    <a href="index.html" class="back-btn-full">← Back to catalog</a>
                </div>
            </div>

            <div class="trust-badges">
                <div class="trust-pill">
                    <span class="trust-dot"></span>
                    Dispatched within 24 hours
                </div>
                <div class="trust-grid ${p.category && p.category.toLowerCase() === 'perfume' ? '' : 'trust-grid-2col'}">
                    <div class="trust-item">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="14" height="10"/><path d="M15 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
                        <h4>3-7 day delivery</h4>
                        <p>Pan India shipping</p>
                    </div>
                    ${p.category && p.category.toLowerCase() === 'perfume' ? `
                    <div class="trust-item">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><polyline points="9 5 12 6 12 9"/></svg>
                        <h4>7 day return</h4>
                        <p>No questions asked</p>
                    </div>
                    ` : ''}
                    <div class="trust-item">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
                        <h4>24 hr support</h4>
                        <p>On WhatsApp</p>
                    </div>
                </div>
            </div>

            <div class="related-products" id="relatedProducts" style="display:none;">
                <p class="related-heading">More from <span id="relatedBrandName"></span></p>
                <div class="related-scroll" id="relatedScroll"></div>
            </div>

            <div class="why-us">
                <p class="why-us-heading"><span>★</span> Things we do that actually makes sense</p>
                <div class="why-us-grid">
                    <div class="why-us-item">
                        <span class="why-us-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.06-1.33A9.96 9.96 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
                        </span>
                        <h4>WhatsApp support</h4>
                        <p>Every order is handled through WhatsApp, so your questions are always just one message away — even after you place your order.</p>
                    </div>
                    <div class="why-us-item">
                        <span class="why-us-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </span>
                        <h4>We listen to you</h4>
                        <p>Your feedback drives us. We launch requested fragrances and take every genuine complaint seriously to keep improving.</p>
                    </div>
                </div>
            </div>

        `;

        loadRelatedByBrand(p.brand, p.id);
        loadProductNotes(p.id);
    } catch (err) {
        wrap.innerHTML = `<div class="empty">Error: ${escapeHtml(err.message)}</div>`;
    }
}

loadProduct();

function initNotesScroller() {
    const row = document.getElementById('productNotesRow');
    const fadeLeft = document.getElementById('pnFadeLeft');
    const fadeRight = document.getElementById('pnFadeRight');
    const arrowLeft = document.getElementById('pnArrowLeft');
    const arrowRight = document.getElementById('pnArrowRight');
    if (!row) return;

    function updateAffordances() {
        const hasOverflow = row.scrollWidth > row.clientWidth + 2;
        const atStart = row.scrollLeft <= 2;
        const atEnd = row.scrollLeft >= row.scrollWidth - row.clientWidth - 2;

        fadeLeft.classList.toggle('show', hasOverflow && !atStart);
        fadeRight.classList.toggle('show', hasOverflow && !atEnd);
        arrowLeft.classList.toggle('show', hasOverflow && !atStart);
        arrowRight.classList.toggle('show', hasOverflow && !atEnd);
    }

    arrowLeft.addEventListener('click', () => row.scrollBy({ left: -180, behavior: 'smooth' }));
    arrowRight.addEventListener('click', () => row.scrollBy({ left: 180, behavior: 'smooth' }));
    row.addEventListener('scroll', updateAffordances);
    window.addEventListener('resize', updateAffordances);

    // Run once layout settles (images loading can change scrollWidth)
    requestAnimationFrame(updateAffordances);
    setTimeout(updateAffordances, 300);
}

async function loadProductNotes(productId) {
    const section = document.getElementById('productNotes');
    const row = document.getElementById('productNotesRow');
    if (!productId) return;

    try {
        const res = await fetch(`${API_BASE}/get_product_notes.php?product_id=${encodeURIComponent(productId)}`);
        const data = await res.json();
        if (!data.success || !data.notes || data.notes.length === 0) return;

        row.innerHTML = data.notes.map(n => `
            <div class="product-note">
                <div class="product-note-img">
                    <img src="${escapeHtml(n.image)}" alt="${escapeHtml(n.name)}" loading="lazy" onerror="this.style.opacity=0">
                </div>
                <p class="product-note-name">${escapeHtml(n.name)}</p>
            </div>
        `).join('');
        section.style.display = 'block';
        initNotesScroller();
    } catch (err) {
        // fine — notes section just stays hidden if this fails
    }
}

async function loadRelatedByBrand(brand, currentId) {
    const section = document.getElementById('relatedProducts');
    const scroll = document.getElementById('relatedScroll');
    const brandNameEl = document.getElementById('relatedBrandName');
    if (!brand) return;

    const normalize = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const targetNorm = normalize(brand);

    try {
        let allProducts = [];
        let page = 1;
        let hasMore = true;

        while (hasMore && page <= 15) {
            const res = await fetch(`${API_BASE}/get_products.php?page=${page}`);
            const data = await res.json();
            if (!data.success) break;
            allProducts = allProducts.concat(data.products);
            hasMore = !!data.hasMore;
            page++;
        }

        let items = allProducts.filter(p =>
            normalize(p.brand) === targetNorm && String(p.id) !== String(currentId)
        );

        if (items.length === 0) {
            items = allProducts.filter(p => {
                const pNorm = normalize(p.brand);
                return pNorm && String(p.id) !== String(currentId) &&
                    (pNorm.includes(targetNorm) || targetNorm.includes(pNorm));
            });
        }

        items = items.slice(0, 5);
        if (items.length === 0) return;

        brandNameEl.textContent = brand;
        scroll.innerHTML = items.map(p => `
            <a class="related-card" href="product.html?id=${p.id}">
                <div class="related-card-img">
                    <img src="${p.image ? escapeHtml(p.image) : ''}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.style.opacity=0">
                </div>
                <p class="related-card-name">${escapeHtml(p.name)}</p>
            </a>
        `).join('');
        section.style.display = 'block';

        function updateActiveRelatedCard() {
            const cards = scroll.querySelectorAll('.related-card');
            if (!cards.length) return;
            if (window.innerWidth >= 640) {
                cards.forEach(c => c.classList.remove('rc-active'));
                return;
            }
            const mid = scroll.scrollLeft + scroll.clientWidth / 2;
            let closest = cards[0];
            let closestDist = Infinity;
            cards.forEach(c => {
                const cardMid = c.offsetLeft + c.offsetWidth / 2;
                const dist = Math.abs(mid - cardMid);
                if (dist < closestDist) { closestDist = dist; closest = c; }
            });
            cards.forEach(c => c.classList.toggle('rc-active', c === closest));
        }
        scroll.addEventListener('scroll', updateActiveRelatedCard);
        window.addEventListener('resize', updateActiveRelatedCard);
        updateActiveRelatedCard();
    } catch (err) {
    }
}
</script>

</body>
</html>
